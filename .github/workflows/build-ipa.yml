name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project CalendoEksypnaRantevoyIatreioyMeFoni.xcodeproj \
            -scheme CalendoEksypnaRantevoyIatreioyMeFoni \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/Calendo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Calendo.xcarchive/Products/Applications/*.app Payload/
          zip -qr Calendo.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calendo-IPA
          path: Calendo.ipa
          retention-days: 7